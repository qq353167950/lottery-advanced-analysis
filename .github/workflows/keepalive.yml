name: keepalive

on:
  schedule:
    # Monthly keepalive commit to prevent scheduled workflows from being disabled after inactivity.
    - cron: '17 1 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ACTIONS_KEEPALIVE_PAT || github.token }}

      - name: Update keepalive marker
        run: |
          mkdir -p .github
          date -u +'%Y-%m-%dT%H:%M:%SZ' > .github/keepalive.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/keepalive.txt
          git commit -m 'chore: keep scheduled workflows active' || exit 0
          git push
