name: daily-lottery-recommend

on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:
    inputs:
      games:
        description: 'auto 或 DLT / SSQ / DLT,SSQ'
        required: false
        default: 'auto'
      mode:
        description: 'package=完整包；single=5注单式；multi=复式预算；mixed=混合预算'
        required: false
        default: 'package'
      bets:
        description: '单式注数，默认5；仅 single 模式使用'
        required: false
        default: '5'
      budget:
        description: '总预算（元），默认20'
        required: false
        default: '20'
      mc:
        description: '蒙特卡洛模拟次数'
        required: false
        default: '100000'

permissions:
  contents: read

jobs:
  recommend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run recommendation and send PushPlus
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          PUSHPLUS_TOPIC: ${{ secrets.PUSHPLUS_TOPIC }}
          PUSHPLUS_CHANNEL: ${{ secrets.PUSHPLUS_CHANNEL }}
          PUSHPLUS_TEMPLATE: html
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            GAMES='${{ github.event.inputs.games }}'
            MODE='${{ github.event.inputs.mode }}'
            BETS='${{ github.event.inputs.bets }}'
            BUDGET='${{ github.event.inputs.budget }}'
            MC='${{ github.event.inputs.mc }}'
          else
            GAMES='auto'
            MODE='package'
            BETS='5'
            BUDGET='20'
            MC='100000'
          fi
          python scripts/daily_pushplus.py --games "$GAMES" --mode "$MODE" --bets "$BETS" --budget "$BUDGET" --mc "$MC"
