name: daily-lottery-recommend

on:
  schedule:
    # 08:30 Asia/Shanghai. GitHub cron uses UTC.
    - cron: '30 0 * * *'
  workflow_dispatch:
    inputs:
      games:
        description: 'auto 或 DLT / SSQ / DLT,SSQ'
        required: false
        default: 'auto'
      single_bets:
        description: '单式注数，默认5'
        required: false
        default: '5'
      multi_budget:
        description: '2组复式总预算上限（元），默认20'
        required: false
        default: '20'
      mc:
        description: '蒙特卡洛模拟次数'
        required: false
        default: '100000'

permissions:
  contents: read

jobs:
  recommend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run recommendation and send PushPlus
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          PUSHPLUS_TOPIC: ${{ secrets.PUSHPLUS_TOPIC }}
          PUSHPLUS_CHANNEL: ${{ secrets.PUSHPLUS_CHANNEL }}
          PUSHPLUS_TEMPLATE: html
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            GAMES='${{ github.event.inputs.games }}'
            SINGLE_BETS='${{ github.event.inputs.single_bets }}'
            MULTI_BUDGET='${{ github.event.inputs.multi_budget }}'
            MC='${{ github.event.inputs.mc }}'
          else
            GAMES='auto'
            SINGLE_BETS='5'
            MULTI_BUDGET='20'
            MC='100000'
          fi
          python scripts/daily_pushplus.py \
            --games "$GAMES" \
            --single-bets "$SINGLE_BETS" \
            --multi-budget "$MULTI_BUDGET" \
            --mc "$MC"
